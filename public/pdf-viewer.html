<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>PDF Viewer</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #fff;
            font-family: system-ui, sans-serif;
        }

        #pdfContainer,
        #viewerContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #errorBox {
            display: none;
            margin: 24px;
            padding: 16px;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-size: 14px;
            max-width: 420px;
        }
    </style>
</head>

<body>
    <div id="errorBox"></div>
    <div id="pdfContainer"></div>

    <!-- PDF.js (CDN; disableWorker evita falha quando o worker externo não carrega) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        let currentPdf = null;
        let currentPage = 1;
        let currentScale = 1.5;
        let loadingTask = null;
        // O parent pode reenviar o mesmo PDF várias vezes; cada carga nova destrói a
        // anterior, que rejeita com "Worker was destroyed". Só a última carga conta.
        let loadSeq = 0;
        // Comparação do base64 inteiro: tamanho + início/fim colide entre PDFs do mesmo
        // gerador (mesmo tamanho e trailer) e mostraria o documento anterior.
        let lastPdfBase64 = null;
        let renderSeq = 0;
        let currentRenderTask = null;

        function isCancelamento(err) {
            if (!err) return false;
            if (err.name === 'RenderingCancelledException') return true;
            return /Worker was destroyed/i.test(String(err.message || err));
        }

        function cancelarRender() {
            if (currentRenderTask) {
                try { currentRenderTask.cancel(); } catch (_) { /* ignore */ }
                currentRenderTask = null;
            }
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            const container = document.getElementById('pdfContainer');
            if (box) {
                box.style.display = 'block';
                box.textContent = msg || 'Falha ao carregar o PDF.';
            }
            if (container) container.innerHTML = '';
            window.parent.postMessage({ pdfError: msg || 'Falha ao carregar o PDF.' }, '*');
        }

        function clearError() {
            const box = document.getElementById('errorBox');
            if (box) {
                box.style.display = 'none';
                box.textContent = '';
            }
        }

        function base64ToUint8Array(base64) {
            const raw = atob(base64);
            const uint8Array = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) {
                uint8Array[i] = raw.charCodeAt(i);
            }
            return uint8Array;
        }

        function postViewportInfo(viewport) {
            if (!viewport) return;
            window.parent.postMessage({
                pdfViewport: {
                    width: Math.floor(viewport.width),
                    height: Math.floor(viewport.height),
                    scale: currentScale,
                    page: currentPage
                }
            }, "*");
        }

        function renderPage(pageNum, scale = currentScale) {
            if (!currentPdf) return;

            const mySeq = ++renderSeq;
            cancelarRender();

            currentPdf.getPage(pageNum).then(page => {
                if (mySeq !== renderSeq) return;
                const container = document.getElementById('pdfContainer');
                container.innerHTML = '';

                const devicePixelRatio = window.devicePixelRatio || 1;
                const outputScale = devicePixelRatio;

                const scaledViewport = page.getViewport({ scale });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                canvas.width = Math.floor(scaledViewport.width * outputScale);
                canvas.height = Math.floor(scaledViewport.height * outputScale);

                canvas.style.width = Math.floor(scaledViewport.width) + 'px';
                canvas.style.height = Math.floor(scaledViewport.height) + 'px';
                container.appendChild(canvas);

                context.scale(outputScale, outputScale);

                postViewportInfo(scaledViewport);

                const renderContext = {
                    canvasContext: context,
                    viewport: scaledViewport
                };

                const renderTask = page.render(renderContext);
                currentRenderTask = renderTask;
                renderTask.promise.then(() => {
                    if (currentRenderTask === renderTask) currentRenderTask = null;
                }).catch(err => {
                    if (isCancelamento(err) || mySeq !== renderSeq) return;
                    console.error('Erro ao renderizar página:', err);
                    showError('Erro ao renderizar a página do PDF.');
                });
            }).catch(err => {
                if (isCancelamento(err) || mySeq !== renderSeq) return;
                console.error('Erro ao obter página:', err);
                showError('Erro ao abrir a página do PDF.');
            });
        }

        function loadPdf(pdfBase64) {
            if (typeof pdfjsLib === 'undefined') {
                showError('Biblioteca PDF.js não carregou (rede/CDN).');
                return;
            }

            if (pdfBase64 === lastPdfBase64) return;
            lastPdfBase64 = pdfBase64;
            const seq = ++loadSeq;

            clearError();
            cancelarRender();
            try {
                if (loadingTask && loadingTask.destroy) {
                    try { loadingTask.destroy(); } catch (_) { /* ignore */ }
                }
            } catch (_) { /* ignore */ }

            let pdfData;
            try {
                pdfData = base64ToUint8Array(pdfBase64);
            } catch (err) {
                console.error(err);
                lastPdfBase64 = null;
                showError('Base64 do PDF inválido.');
                return;
            }

            loadingTask = pdfjsLib.getDocument({
                data: pdfData,
                disableWorker: true,
                isEvalSupported: false,
            });

            loadingTask.promise.then(pdf => {
                if (seq !== loadSeq) return;
                currentPdf = pdf;
                currentPage = 1;
                window.parent.postMessage({ totalPages: pdf.numPages }, "*");
                pdf.getPage(1).then(page => {
                    if (seq !== loadSeq) return;
                    const naturalViewport = page.getViewport({ scale: 1 });
                    const containerWidth = document.getElementById('pdfContainer').clientWidth;
                    currentScale = containerWidth > 0
                        ? containerWidth / naturalViewport.width
                        : 1.5;
                    renderPage(currentPage, currentScale);
                }).catch(err => {
                    if (seq !== loadSeq || isCancelamento(err)) return;
                    console.error(err);
                    showError('Não foi possível ler a primeira página.');
                });
            }).catch(err => {
                if (seq !== loadSeq || isCancelamento(err)) return;
                console.error('Erro ao carregar PDF:', err);
                lastPdfBase64 = null;
                showError((err && err.message) ? err.message : 'Erro ao carregar PDF.');
            });
        }

        window.addEventListener('message', (event) => {
            const data = event.data || {};
            const { pdfBase64, page, zoom, zoomIn, zoomOut, zoomReset } = data;

            if (pdfBase64) {
                loadPdf(pdfBase64);
            }

            if (page && currentPdf) {
                currentPage = Math.min(Math.max(page, 1), currentPdf.numPages);
                renderPage(currentPage, currentScale);
            }

            if (zoom !== undefined && currentPdf) {
                currentScale = Math.max(0.5, Math.min(5, zoom));
                renderPage(currentPage, currentScale);
            }

            if (zoomIn && currentPdf) {
                currentScale = Math.min(5, currentScale + 0.25);
                renderPage(currentPage, currentScale);
            }

            if (zoomOut && currentPdf) {
                currentScale = Math.max(0.5, currentScale - 0.25);
                renderPage(currentPage, currentScale);
            }

            if (zoomReset && currentPdf) {
                currentScale = 1.5;
                renderPage(currentPage, currentScale);
            }
        });

        // Sinaliza ao parent que o viewer está pronto para receber o PDF.
        window.parent.postMessage({ pdfViewerReady: true }, '*');
    </script>
</body>

</html>
